name: peptide-planner

services:
  peptide-planner:
    build: .
    container_name: peptide-planner
    restart: unless-stopped
    ports:
      # host:container — change the left side to expose a different port on your LAN.
      - "4173:4173"
    volumes:
      # Persists data/peptide-planner.sqlite across container rebuilds.
      - ./data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=4173
      - PEPTIDE_PLANNER_DATA_DIR=/data
